# Configuración por defecto del Servidor Central de edEXT.
#
# Para cambiarla sin recompilar, copiá este archivo como config.properties
# a la carpeta desde donde ejecutás el SC (o a ~/.edext/config.properties,
# o indicá la ruta con -Dedext.config=/ruta/config.properties).

# URL donde se publica el Web Service (Endpoint.publish).
# - "localhost" solo acepta conexiones desde la misma PC (desarrollo).
# - Para que el servidor web se conecte desde otra PC, usá la IP de esta PC
#   (por ejemplo http://192.168.1.10:9128/edext) o 0.0.0.0 para escuchar en todas.
ws.url=http://localhost:9128/edext

# Carpeta base de las imágenes (se guardan en <carpeta>/uploads/...).
# Si se deja vacío se usa <carpeta de usuario>/mi_proyecto_data.
edext.imagenes.dir=
