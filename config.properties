# ============================================================================
#  Configuración de edEXT (Servidor Central y Servidor Web)
# ============================================================================
#
# Un solo archivo para los dos programas. Se busca:
#   - Servidor Central (.jar): en la carpeta del .jar y en las de arriba
#     (así encuentra este archivo en la raíz del repo, o uno copiado al lado
#     del .jar en otra PC).
#   - Servidor Web (.war): subiendo desde donde Tomcat lo despliega
#     (con NetBeans llega a la raíz del repo; en otra PC alcanza con dejarlo
#     en la carpeta de Tomcat). Si no lo encuentra, usa edext.ws.url del web.xml.
# En ambos casos se puede indicar una ruta con -Dedext.config=/ruta/config.properties
# o con la variable de entorno EDEXT_CONFIG.

# URL del Web Service del Servidor Central.
#   - El Servidor Central publica en este puerto y ruta.
#   - El Servidor Web (y el móvil) se conectan a esta dirección.
# Todo en la misma PC: http://localhost:9128/edext
# Demo en varias PCs: la IP de la PC del Servidor Central, por ejemplo
#   http://192.168.1.10:9128/edext
# (con una IP, el Servidor Central escucha en todas las interfaces de red)
ws.url=http://localhost:9128/edext

# Carpeta base de las imágenes (solo la usa el Servidor Central; se guardan en
# <carpeta>/uploads/...). Vacío = <carpeta del usuario>/mi_proyecto_data
edext.imagenes.dir=
