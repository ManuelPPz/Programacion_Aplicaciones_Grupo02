# ============================================================================
#  Configuración de edEXT (Servidor Central y Servidor Web)
# ============================================================================
#
# Este archivo vive en la carpeta .edEXT del home del usuario
# (p. ej. /home/<usuario>/.edEXT/config.properties o C:\Users\<usuario>\.edEXT\config.properties).
# Se puede cambiar sin volver a generar servidor.jar ni web.war: alcanza con
# reiniciar el programa (o recargar la aplicación en Tomcat).
# Si el Servidor Central no lo encuentra al arrancar, lo crea con estos valores.

# URL del Web Service del Servidor Central.
#   - El Servidor Central publica en este puerto y ruta.
#   - El Servidor Web se conecta a esta dirección.
# Todo en la misma PC: http://localhost:9128/edext
# Demo en varias PCs: la IP de la PC del Servidor Central, p. ej. http://192.168.1.10:9128/edext
ws.url=http://localhost:9128/edext

# Base de datos MySQL del Servidor Central
db.url=jdbc:mysql://localhost:3306/edEXT_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.usuario=UserLab
db.password=userlab

# Carpeta base de las imágenes (solo la usa el Servidor Central; se guardan en
# <carpeta>/uploads/...). Vacío = <carpeta del usuario>/mi_proyecto_data
edext.imagenes.dir=
